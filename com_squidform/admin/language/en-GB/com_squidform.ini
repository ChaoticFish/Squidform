COM_SQUIDFORM_CONFIG_MAX_AGE_DESC="A form page left open longer than this must be reloaded before it can be submitted."
COM_SQUIDFORM_CONFIG_INPUT_RECIPIENTS="Allow Recipients From Form Input"
COM_SQUIDFORM_CONFIG_INPUT_RECIPIENTS_DESC="When off, Email actions refuse To/Cc/Bcc addresses that come from submitted data. Reply-To may always use submitted data."
COM_SQUIDFORM_CONFIG_EXTERNAL_REDIRECTS="Allow External Redirects"
COM_SQUIDFORM_CONFIG_EXTERNAL_REDIRECTS_DESC="When off, the Redirect action only sends people to pages on this site."
COM_SQUIDFORM_CONFIG_READ_TABLES="Tables SquidForm May Read"
COM_SQUIDFORM_CONFIG_READ_TABLES_DESC="One table or database view per line, e.g. #__my_offices. Empty by default. Used by dropdown option sources and Read Data, and whatever a form reads, its visitors can see. Usually safe: #__categories and #__tags (titles), and your own tables. Think twice about #__content: it holds drafts, trashed and members-only articles, and Read Data doesn't apply access levels; a database view of only published, public articles is safer (see Check this server). Joomla tables holding passwords, sessions or keys can never be used. Another form's data tables (#__sfd_…) can be read only if you list them here."
COM_SQUIDFORM_CONFIG_WRITE_TABLES="Tables SquidForm May Write"
COM_SQUIDFORM_CONFIG_WRITE_TABLES_DESC="One table per line. Used by Save Data with a custom table. Each form always writes to its own data table without being listed; another form's data table (#__sfd_…) must be listed here."
COM_SQUIDFORM_CONFIG_OPTIONS_FOLDER="Option Files Folder"
COM_SQUIDFORM_CONFIG_OPTIONS_FOLDER_DESC="Folder (relative to the site root) holding .json, .csv and .txt option files. Files outside it are refused."

