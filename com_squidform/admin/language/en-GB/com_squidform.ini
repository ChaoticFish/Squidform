COM_SQUIDFORM_ESIGN_DISCLAIMER="An e-signature here is meant for ordinary business and internal forms (under the US ESIGN Act and UETA): it records who signed (a signed-in account), what they saw and agreed to, when, and a fingerprint of the signed answers. It is not a digital signature with certificates, it is not PIV/CAC or PKI signing, and it uses the server's clock, not an outside timestamp. Don't use it for wills, codicils or trusts, court orders or official court papers, notices of default, foreclosure, eviction or cancellation of utilities or insurance, product recalls, hazardous-materials documents, official agency records, or anything your organisation requires PIV/CAC or PKI signatures for. Ask your legal or records office before relying on it."
