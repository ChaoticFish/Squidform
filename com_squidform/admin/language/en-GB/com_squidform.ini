COM_SQUIDFORM_ACTION_VIEW_OWN_DESC="Allows logged-in users to view submissions they made."
COM_SQUIDFORM_ACTION_EDIT="Edit Submissions"
COM_SQUIDFORM_ACTION_EDIT_DESC="Allows users in the group to edit any submission (phase 2)."
COM_SQUIDFORM_ACTION_EDIT_OWN="Edit Own Submissions"
COM_SQUIDFORM_ACTION_EDIT_OWN_DESC="Allows users to edit submissions they made (phase 2)."
COM_SQUIDFORM_ACTION_APPROVE="Approve Submissions"
COM_SQUIDFORM_ACTION_APPROVE_DESC="Allows users to approve, return or reject requests on a step where they are an approver (or a delegate of one), and to open those requests. Without a place on the step this permission does nothing."
COM_SQUIDFORM_ACTION_EXPORT="Export Submissions"
COM_SQUIDFORM_ACTION_EXPORT_DESC="Allows users to export submissions to CSV or JSON. They also need View Submissions. IP addresses are never exported."
COM_SQUIDFORM_ACTION_DELETE="Archive Submissions"
COM_SQUIDFORM_ACTION_DELETE_DESC="Allows users to archive and restore submissions. Archived submissions are kept."
COM_SQUIDFORM_ACTION_DELETE_HARD="Permanently Delete"
COM_SQUIDFORM_ACTION_DELETE_HARD_DESC="Allows users to permanently delete ARCHIVED submissions and ARCHIVED forms (with their data tables), after typing a confirmation. This cannot be undone. Give it to very few people."
COM_SQUIDFORM_ACTION_DEV="Developer Tools"
COM_SQUIDFORM_ACTION_DEV_DESC="Shows debug output, the raw JSON editor and PHP handlers. Give this only to developers."

